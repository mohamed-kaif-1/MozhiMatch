{
  "openapi": "3.1.0",
  "info": {
    "title": "Bilingual MCQ Preflight",
    "version": "0.1.0"
  },
  "servers": [
    {
      "url": "http://localhost:3000"
    }
  ],
  "paths": {
    "/api/analyze": {
      "post": {
        "summary": "Review paired practice items",
        "parameters": [
          {
            "in": "header",
            "name": "X-Demo-Code",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Required for hosted AI mode only"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AnalyzeRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Rules plus validated semantic data or fallback",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AnalyzeResponse"
                }
              }
            }
          },
          "400": {
            "description": "Malformed JSON",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "Invalid demo capability",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "Origin or demo item forbidden",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "413": {
            "description": "Too many bytes",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "415": {
            "description": "Non JSON",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "422": {
            "description": "Invalid data or absent consent",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "429": {
            "description": "Throttled",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "500": {
            "description": "Unexpected server failure",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/health": {
      "get": {
        "summary": "Configuration health, no provider call",
        "responses": {
          "200": {
            "description": "Safe configuration",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "status": {
                      "type": "string",
                      "enum": [
                        "ok"
                      ]
                    },
                    "aiConfigured": {
                      "type": "boolean"
                    },
                    "deploymentMode": {
                      "type": "string",
                      "enum": [
                        "local",
                        "public_demo"
                      ]
                    }
                  },
                  "required": [
                    "status",
                    "aiConfigured",
                    "deploymentMode"
                  ]
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "AnalyzeRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "requestId": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "locale": {
            "type": "string",
            "enum": [
              "en",
              "ta"
            ]
          },
          "mode": {
            "type": "string",
            "enum": [
              "rules",
              "ai"
            ]
          },
          "sourceKind": {
            "type": "string",
            "enum": [
              "synthetic",
              "public",
              "owned_practice"
            ]
          },
          "consent": {
            "type": "boolean"
          },
          "items": {
            "type": "array",
            "minItems": 1,
            "maxItems": 10,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "id": {
                  "type": "string",
                  "pattern": "^[A-Za-z0-9_-]{1,40}$"
                },
                "en": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "stem": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 2000
                    },
                    "options": {
                      "type": "array",
                      "minItems": 2,
                      "maxItems": 5,
                      "items": {
                        "type": "object",
                        "additionalProperties": false,
                        "properties": {
                          "label": {
                            "type": "string",
                            "enum": [
                              "A",
                              "B",
                              "C",
                              "D",
                              "E"
                            ]
                          },
                          "text": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 400
                          }
                        },
                        "required": [
                          "label",
                          "text"
                        ]
                      }
                    }
                  },
                  "required": [
                    "stem",
                    "options"
                  ]
                },
                "ta": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "stem": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 2000
                    },
                    "options": {
                      "type": "array",
                      "minItems": 2,
                      "maxItems": 5,
                      "items": {
                        "type": "object",
                        "additionalProperties": false,
                        "properties": {
                          "label": {
                            "type": "string",
                            "enum": [
                              "A",
                              "B",
                              "C",
                              "D",
                              "E"
                            ]
                          },
                          "text": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 400
                          }
                        },
                        "required": [
                          "label",
                          "text"
                        ]
                      }
                    }
                  },
                  "required": [
                    "stem",
                    "options"
                  ]
                }
              },
              "required": [
                "id",
                "en",
                "ta"
              ]
            }
          }
        },
        "required": [
          "requestId",
          "revision",
          "locale",
          "mode",
          "sourceKind",
          "consent",
          "items"
        ],
        "$schema": "https://json-schema.org/draft/2020-12/schema"
      },
      "AnalyzeResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "requestId": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "mode": {
            "type": "string",
            "enum": [
              "rules_only",
              "live_ai"
            ]
          },
          "model": {
            "type": [
              "string",
              "null"
            ]
          },
          "providerStatus": {
            "type": "string",
            "enum": [
              "not_requested",
              "ok",
              "unavailable",
              "timeout",
              "invalid_response"
            ]
          },
          "warnings": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "AI_DISABLED",
                "AI_UNAVAILABLE",
                "AI_TIMEOUT",
                "AI_INVALID_RESPONSE",
                "UNSUPPORTED_CONTENT"
              ]
            }
          },
          "items": {
            "type": "array",
            "minItems": 1,
            "maxItems": 10,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "id": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 40
                },
                "status": {
                  "type": "string",
                  "enum": [
                    "meaning_changed",
                    "no_issue_found",
                    "needs_review"
                  ]
                },
                "structuralFindings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "type": "string",
                        "enum": [
                          "OPTION_COUNT_MISMATCH",
                          "OPTION_LABEL_MISMATCH",
                          "DUPLICATE_OPTION_LABEL",
                          "NUMERIC_TOKEN_DIFFERENCE",
                          "UNIT_TOKEN_DIFFERENCE"
                        ]
                      },
                      "field": {
                        "type": "object",
                        "additionalProperties": false,
                        "properties": {
                          "kind": {
                            "type": "string",
                            "enum": [
                              "stem",
                              "option"
                            ]
                          },
                          "label": {
                            "type": [
                              "string",
                              "null"
                            ],
                            "enum": [
                              "A",
                              "B",
                              "C",
                              "D",
                              "E",
                              null
                            ]
                          }
                        },
                        "required": [
                          "kind",
                          "label"
                        ]
                      },
                      "enTokens": {
                        "type": "array",
                        "items": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 80
                        }
                      },
                      "taTokens": {
                        "type": "array",
                        "items": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 80
                        }
                      }
                    },
                    "required": [
                      "code",
                      "field",
                      "enTokens",
                      "taTokens"
                    ]
                  }
                },
                "comparisons": {
                  "type": "array",
                  "maxItems": 6,
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "field": {
                        "type": "object",
                        "additionalProperties": false,
                        "properties": {
                          "kind": {
                            "type": "string",
                            "enum": [
                              "stem",
                              "option"
                            ]
                          },
                          "label": {
                            "type": [
                              "string",
                              "null"
                            ],
                            "enum": [
                              "A",
                              "B",
                              "C",
                              "D",
                              "E",
                              null
                            ]
                          }
                        },
                        "required": [
                          "kind",
                          "label"
                        ]
                      },
                      "relation": {
                        "type": "string",
                        "enum": [
                          "equivalent",
                          "different",
                          "uncertain"
                        ]
                      },
                      "en": {
                        "type": "object",
                        "additionalProperties": false,
                        "properties": {
                          "start": {
                            "type": "integer",
                            "minimum": 0
                          },
                          "end": {
                            "type": "integer",
                            "minimum": 1
                          },
                          "text": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 2000
                          }
                        },
                        "required": [
                          "start",
                          "end",
                          "text"
                        ]
                      },
                      "ta": {
                        "type": "object",
                        "additionalProperties": false,
                        "properties": {
                          "start": {
                            "type": "integer",
                            "minimum": 0
                          },
                          "end": {
                            "type": "integer",
                            "minimum": 1
                          },
                          "text": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 2000
                          }
                        },
                        "required": [
                          "start",
                          "end",
                          "text"
                        ]
                      },
                      "reasonCode": {
                        "type": "string",
                        "enum": [
                          "equivalent",
                          "negation",
                          "entity",
                          "qualifier",
                          "option_meaning",
                          "uncertain",
                          "other_material_change"
                        ]
                      },
                      "explanation": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 600
                      },
                      "evidenceValid": {
                        "const": true
                      }
                    },
                    "required": [
                      "field",
                      "relation",
                      "en",
                      "ta",
                      "reasonCode",
                      "explanation",
                      "evidenceValid"
                    ]
                  }
                }
              },
              "required": [
                "id",
                "status",
                "structuralFindings",
                "comparisons"
              ]
            }
          }
        },
        "required": [
          "requestId",
          "revision",
          "mode",
          "model",
          "providerStatus",
          "warnings",
          "items"
        ],
        "$schema": "https://json-schema.org/draft/2020-12/schema"
      },
      "ErrorResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string",
                "enum": [
                  "INVALID_REQUEST",
                  "BODY_TOO_LARGE",
                  "UNSUPPORTED_MEDIA_TYPE",
                  "FORBIDDEN_ORIGIN",
                  "UNAUTHORIZED_DEMO",
                  "DEMO_INPUT_RESTRICTED",
                  "CONSENT_REQUIRED",
                  "RATE_LIMITED",
                  "INTERNAL_ERROR"
                ]
              },
              "messageKey": {
                "type": "string",
                "minLength": 1,
                "maxLength": 80
              },
              "requestId": {
                "type": [
                  "string",
                  "null"
                ]
              }
            },
            "required": [
              "code",
              "messageKey",
              "requestId"
            ]
          }
        },
        "required": [
          "error"
        ]
      }
    }
  }
}
